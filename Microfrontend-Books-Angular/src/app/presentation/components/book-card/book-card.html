<div class="card h-100 shadow-sm book-card">
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start">
      <h5 class="card-title mb-1">{{ book().title }}</h5>
      <span class="badge text-bg-primary">{{ book().genre }}</span>
    </div>
    <h6 class="card-subtitle mb-2 text-body-secondary">
      <i class="bi bi-person"></i> {{ book().author }}
    </h6>
    <ul class="list-unstyled small text-body-secondary mb-3">
      <li><i class="bi bi-calendar"></i> Año: {{ book().year }}</li>
      <li><i class="bi bi-hash"></i> ID: {{ book().id }}</li>
    </ul>
    <div class="mt-auto fw-bold text-success">
      {{ book().price | currency: 'COP' : 'symbol-narrow' : '1.0-0' }}
    </div>
  </div>
</div>
