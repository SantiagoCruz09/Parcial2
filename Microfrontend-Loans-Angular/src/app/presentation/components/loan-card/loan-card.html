<div class="card h-100 shadow-sm loan-card">
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start">
      <h5 class="card-title mb-1">{{ loan().bookTitle }}</h5>
      <span class="badge" [class]="statusBadgeClass[loan().status]">
        {{ loan().status }}
      </span>
    </div>
    <h6 class="card-subtitle mb-2 text-body-secondary">
      <i class="bi bi-person"></i> {{ loan().userName }}
    </h6>
    <ul class="list-unstyled small text-body-secondary mb-0 mt-3">
      <li><i class="bi bi-calendar-check"></i> Préstamo: {{ loan().loanDate }}</li>
      <li><i class="bi bi-calendar-x"></i> Devolución: {{ loan().returnDate }}</li>
      <li><i class="bi bi-hash"></i> ID: {{ loan().id }}</li>
    </ul>
    <button type="button" class="btn btn-sm btn-outline-primary mt-3" (click)="detailRequested.emit(loan().id)">
      Ver detalle
    </button>
  </div>
</div>
